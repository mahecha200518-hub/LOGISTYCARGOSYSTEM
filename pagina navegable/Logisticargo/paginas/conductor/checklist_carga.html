<!-- ==========================================================
     CONDUCTOR - SERVICIOS ASIGNADOS (CHECKLIST DE CARGA)

     Lista de tareas que el conductor marca como completadas
     antes de salir con la carga.

     IMPORTANTE: la lógica de esta pantalla vive en
     javascript/aplicacion.js, dentro de Alpine.data('checklistCarga').
     No se modificó: x-data="checklistCarga()", el toggle
     "it.done=!it.done" y el envío final siguen intactos.

     Estilos específicos: css/conductor/checklist_carga.css
     Estilos comunes de Conductor: css/conductor/conductor_comun.css
     JavaScript: javascript/aplicacion.js (checklistCarga)
     ========================================================== -->
<div class="conductor-pantalla" x-show="$store.app.page==='co_checklist'" x-data="checklistCarga()">

  <a class="conductor-volver" @click.prevent="$store.app.page='co_parada'"><span class="material-symbols-outlined">arrow_back</span>Volver</a>

  <div class="conductor-header">
    <h1>Checklist de carga</h1>
    <p>El cliente puede ver tu progreso en su seguimiento.</p>
  </div>

  <!-- Progreso (calculado en vivo a partir de items, sin nuevo estado) -->
  <div class="checklist-conductor-progreso">
    <div class="conductor-progreso-pista"><div class="conductor-progreso-relleno" :style="'width:'+Math.round(items.filter(i=>i.done).length/items.length*100)+'%'"></div></div>
    <p class="checklist-conductor-progreso-texto"><span x-text="items.filter(i=>i.done).length"></span> de <span x-text="items.length"></span> completados</p>
  </div>

  <div class="checklist-conductor-lista">
    <template x-for="(it,i) in items" :key="i">
      <div class="checklist-conductor-item" @click="it.done=!it.done">
        <div class="checklist-conductor-check" :style="it.done?'background:var(--sage);border-color:var(--sage)':'background:transparent;border-color:var(--taupe)'">
          <span class="material-symbols-outlined checklist-conductor-check-icono" x-show="it.done">check</span>
        </div>
        <p class="checklist-conductor-texto" :style="it.done?'color:var(--taupe);text-decoration:line-through':'color:var(--paper)'" x-text="it.t"></p>
      </div>
    </template>
  </div>

  <button class="conductor-btn-primario checklist-conductor-btn-enviar" @click="$store.app.page='dash_conductor';$store.app.toast_('Checklist completado y enviado a la oficina')"><span class="material-symbols-outlined">task_alt</span>Marcar parada como completada</button>

</div>
