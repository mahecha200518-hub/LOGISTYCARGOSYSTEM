<div class="flex-1 overflow-y-auto p-6" x-show="$store.app.page==='ad_asignaciones'">
<div class="ad-asignaciones-bloque-1">
<div><h1 class="ad-asignaciones-titulo-2">Asignaciones</h1><p class="ad-asignaciones-texto-3">Asigna vehículos y conductores a los servicios pendientes.</p></div>
<button @click="$store.app.toast_('Asignación creada')" class="btn btn-p"><span class="material-symbols-outlined ad-asignaciones-texto-4">add</span>Nueva asignación</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="card ad-asignaciones-bloque-5">

<div class="ad-asignaciones-bloque-7"><label class="lbl">Servicio a asignar</label><select @change="$store.app.toast_('Servicio a asignar: ' + $event.target.value)" class="inp sel"><option>SRV-2026-00850 — Bogotá→Medellín</option><option>SRV-2026-00845 — Cali→Barranquilla</option></select></div>
<div class="ad-asignaciones-bloque-7"><label class="lbl">Vehículo disponible</label><select @change="$store.app.toast_('Vehículo disponible: ' + $event.target.value)" class="inp sel"><option>Ford F-350 · ABC-123 · 2.5 ton</option><option>Kenworth T680 · XYZ-456 · 5 ton</option></select></div>
<div class="ad-asignaciones-bloque-8"><label class="lbl">Conductor</label><select @change="$store.app.toast_('Conductor: ' + $event.target.value)" class="inp sel"><option>Carlos Mendoza · Disponible</option><option>Pedro Ruiz · Disponible</option></select></div>
<button @click="$store.app.toast_('Asignación guardada y conductor notificado')" class="btn btn-p ad-asignaciones-boton-9"><span class="material-symbols-outlined ad-asignaciones-texto-4">assignment_ind</span>Asignar ahora</button>
</div>
<div class="card ad-asignaciones-bloque-5">
<h3 class="ad-asignaciones-subtitulo-10">Pendientes de asignar</h3>
<div class="ad-asignaciones-bloque-11">
<div class="ad-asignaciones-bloque-12">
<div class="ad-asignaciones-bloque-13">
<div><p class="ad-asignaciones-texto-14">SRV-2026-00850</p><p class="ad-asignaciones-texto-15">Bogotá → Medellín · Residencial</p></div>
<span class="badge b-ocre">Pendiente</span>
</div>
<div class="ad-asignaciones-bloque-16"><button @click="$store.app.toast_('SRV-2026-00850 validado')" class="btn btn-p ad-asignaciones-boton-17">Validar</button><button @click="$store.app.toast_('SRV-2026-00850 rechazado')" class="btn btn-d ad-asignaciones-boton-17">Rechazar</button></div>
</div>
<div class="ad-asignaciones-bloque-12">
<div class="ad-asignaciones-bloque-13">

</div>
<div class="ad-asignaciones-bloque-16"><button @click="$store.app.toast_('SRV-2026-00845 validado')" class="btn btn-p ad-asignaciones-boton-17">Validar</button><button @click="$store.app.toast_('SRV-2026-00845 rechazado')" class="btn btn-d ad-asignaciones-boton-17">Rechazar</button></div>
