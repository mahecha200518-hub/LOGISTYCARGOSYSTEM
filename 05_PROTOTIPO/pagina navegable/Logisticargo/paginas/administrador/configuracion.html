<div class="flex-1 overflow-y-auto p-6" x-show="$store.app.page==='ad_config'">
<h1 class="ad-config-titulo-1">Configuración</h1>
<p class="ad-config-texto-2">Ajustes generales del sistema y política de precios.</p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="card ad-config-bloque-3">
<h3 class="ad-config-subtitulo-4">Tarifas de cotización</h3>
<div class="ad-config-bloque-5"><label class="lbl">Costo base por servicio</label><input class="inp" value="$X.XXX.XXX"/></div>
<div class="ad-config-bloque-5"><label class="lbl">Costo por m³ adicional</label><input class="inp" value="$XX.XXX"/></div>
<div class="ad-config-bloque-6"><label class="lbl">Costo por km</label><input class="inp" value="$X.XXX"/></div>
<button @click="$store.app.toast_('Tarifas actualizadas')" class="btn btn-p">Guardar tarifas</button>
</div>
<div class="card ad-config-bloque-3">
<h3 class="ad-config-subtitulo-4">Política de cancelación</h3>
<div class="ad-config-bloque-5"><label class="lbl">Cargo si se cancela con camión en ruta</label><input class="inp" value="20%"/></div>
<div class="ad-config-bloque-6"><label class="lbl">Horas mínimas de aviso sin cargo</label><input class="inp" value="24 horas"/></div>
<button @click="$store.app.toast_('Política actualizada')" class="btn btn-p">Guardar política</button>
</div>
</div>
</div>
