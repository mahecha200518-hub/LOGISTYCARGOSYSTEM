<div class="min-h-screen flex items-center justify-center p-6 auth-registro-bloque-1" x-cloak="" x-show="$store.app.page==='register'">
<div class="card auth-registro-bloque-2">
<div class="auth-registro-bloque-3">
<div class="auth-registro-bloque-4"><span class="material-symbols-outlined auth-registro-texto-5">inventory_2</span></div>
<p class="auth-registro-texto-6">Logisty Cargo</p>
</div>
<h2 class="auth-registro-subtitulo-7">Crear cuenta de cliente</h2>
<div class="grid grid-cols-2 gap-4 mb-4">
<div><label class="lbl">Nombre</label><input class="inp" placeholder="Juan"/></div>
<div><label class="lbl">Apellido</label><input class="inp" placeholder="García"/></div>
</div>
<div class="auth-registro-bloque-8"><label class="lbl">Correo</label><input class="inp" placeholder="juan@correo.com" type="email"/></div>
<div class="auth-registro-bloque-8"><label class="lbl">Teléfono</label><input class="inp" placeholder="+57 300 000 0000"/></div>
<div class="grid grid-cols-2 gap-4 mb-6">
<div><label class="lbl">Contraseña</label><input class="inp" placeholder="••••••••" type="password"/></div>
<div><label class="lbl">Confirmar</label><input class="inp" placeholder="••••••••" type="password"/></div>
</div>
<div class="auth-registro-bloque-9">
<button @click="$store.app.page='login'" class="btn btn-s auth-registro-boton-10">Cancelar</button>
<button @click="$store.app.role='cliente';$store.app.doLogin()" class="btn btn-p auth-registro-boton-10">Crear cuenta</button>
</div>
</div>
</div>
