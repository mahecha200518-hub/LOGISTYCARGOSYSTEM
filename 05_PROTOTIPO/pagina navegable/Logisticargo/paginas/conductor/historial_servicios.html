<!-- ==========================================================
     CONDUCTOR - HISTORIAL

     Historial de paradas y servicios completados por el
     conductor.

     Estilos específicos: css/conductor/historial_servicios.css
     Estilos comunes de Conductor: css/conductor/conductor_comun.css
     Componentes reutilizados: css/componentes/tarjetas.css (.badge, .b-sage, .b-ocre)
     Funcionalidad: javascript/aplicacion.js, javascript/enrutador.js
     ========================================================== -->
<div class="conductor-pantalla" x-show="$store.app.page==='co_historial'">

  <div class="conductor-header">
    <h1>Historial de paradas</h1>
    <p>Tus últimos servicios completados.</p>
  </div>

  <div class="conductor-linea-tiempo historial-conductor-lista">

    <div class="historial-conductor-fila">
      <span class="conductor-linea-punto historial-conductor-punto-ok"><span class="material-symbols-outlined">check</span></span>
      <div class="conductor-card historial-conductor-item">
        <div class="historial-conductor-fila-superior">
          <p class="historial-conductor-codigo conductor-mono">SRV-2026-00846</p>
          <span class="badge b-sage">Completado</span>
        </div>
        <p class="historial-conductor-detalle">Bogotá · 15 sep 2026 · 2 paradas</p>
      </div>
    </div>

    <div class="historial-conductor-fila">
      <span class="conductor-linea-punto historial-conductor-punto-ok"><span class="material-symbols-outlined">check</span></span>
      <div class="conductor-card historial-conductor-item">
        <div class="historial-conductor-fila-superior">
          <p class="historial-conductor-codigo conductor-mono">SRV-2026-00839</p>
          <span class="badge b-sage">Completado</span>
        </div>
        <p class="historial-conductor-detalle">Bogotá → Chía · 8 sep 2026 · 2 paradas</p>
      </div>
    </div>

    <div class="historial-conductor-fila">
      <span class="conductor-linea-punto historial-conductor-punto-alerta"><span class="material-symbols-outlined">priority_high</span></span>
      <div class="conductor-card historial-conductor-item">
        <div class="historial-conductor-fila-superior">
          <p class="historial-conductor-codigo conductor-mono">SRV-2026-00820</p>
          <span class="badge b-ocre">Con novedad</span>
        </div>
        <p class="historial-conductor-detalle">Bogotá → Zipaquirá · 28 ago 2026 · retraso reportado</p>
      </div>
    </div>

  </div>

</div>
