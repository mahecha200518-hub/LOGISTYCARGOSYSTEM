<!-- ==========================================================
     CONDUCTOR - MI VEHÍCULO

     Información del vehículo asignado al conductor.

     Estilos específicos: css/conductor/mi_vehiculo.css
     Estilos comunes de Conductor: css/conductor/conductor_comun.css
     Funcionalidad: javascript/aplicacion.js, javascript/enrutador.js
     ========================================================== -->
<div class="conductor-pantalla" x-show="$store.app.page==='co_vehiculo'">

  <div class="conductor-header vehiculo-conductor-encabezado">
    <div>
      <h1>Mi vehículo</h1>
      <p>Ford F-350 · Camión mediano</p>
    </div>
    <div class="vehiculo-conductor-placa conductor-mono">ABC-123</div>
  </div>

  <div class="conductor-card vehiculo-conductor-datos">
    <div class="conductor-fila">
      <span class="conductor-fila-etiqueta">Capacidad</span>
      <span class="conductor-fila-valor">2.5 ton · 15 m³</span>
    </div>
    <div class="conductor-fila">
      <span class="conductor-fila-etiqueta">Última revisión</span>
      <span class="conductor-fila-valor">10 sep 2026</span>
    </div>
    <div class="conductor-fila">
      <span class="conductor-fila-etiqueta">Próximo mantenimiento</span>
      <span class="conductor-fila-valor vehiculo-conductor-valor-alerta">En 1.200 km</span>
    </div>
    <div class="vehiculo-conductor-gauge">
      <div class="conductor-progreso-pista"><div class="conductor-progreso-relleno vehiculo-conductor-gauge-valor"></div></div>
    </div>
  </div>

  <div class="vehiculo-conductor-acciones">
    <button class="conductor-accion" @click="$store.app.toast_('Inspección registrada')"><span class="material-symbols-outlined vehiculo-conductor-icono-sage">fact_check</span>Registrar inspección previa al turno</button>
    <button class="conductor-accion" @click="$store.app.page='co_mecanico'"><span class="material-symbols-outlined vehiculo-conductor-icono-rust">build</span>Reportar problema mecánico</button>
  </div>

</div>
